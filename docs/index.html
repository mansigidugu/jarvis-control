<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
    --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px; max-width: 900px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header h1 { font-size: 22px; margin: 0; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #0d1117; font-weight: 600;
    padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 14px;
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  section { margin-bottom: 32px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; align-items: center;
  }
  .item a { color: var(--text); text-decoration: none; font-weight: 500; }
  .item a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .open { background: var(--yellow); }
  .done { background: var(--green); }
  .empty { color: var(--muted); font-size: 14px; padding: 12px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; }
  #error { color: var(--red); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🤖 Jarvis</h1>
  <span class="badge" id="lastUpdated">loading…</span>
</header>

<div class="actions">
  <a class="btn" href="https://github.com/mansigidugu/jarvis-control/issues/new?template=scan-repo.yml" target="_blank">🔍 Scan a repo</a>
  <a class="btn" href="https://github.com/mansigidugu/jarvis-control/issues/new?template=fix-target.yml" target="_blank">🛠 Fix issue/PR</a>
  <a class="btn secondary" href="https://github.com/users/mansigidugu/projects/1" target="_blank">Project board</a>
  <a class="btn secondary" href="https://github.com/pulls?q=is%3Apr+author%3Amansigidugu+head%3Ajarvis%2F" target="_blank">All Jarvis PRs</a>
</div>

<div id="error"></div>

<section>
  <h2>Pending triggers</h2>
  <div id="pending" class="empty">Loading…</div>
</section>

<section>
  <h2>Open PRs from Jarvis</h2>
  <div id="prs" class="empty">Loading…</div>
</section>

<section>
  <h2>Recent trigger history</h2>
  <div id="history" class="empty">Loading…</div>
</section>

<footer>
  jarvis-control · auto-refreshes on load · <a href="https://github.com/mansigidugu/jarvis-control" style="color:var(--muted)">source</a>
</footer>

<script>
const OWNER = "mansigidugu";
const REPO = "jarvis-control";
const api = (path) => fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`).then(r => {
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
});
const timeAgo = (iso) => {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
};
const esc = (s) => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load() {
  try {
    const [openTriggers, closedTriggers, prs] = await Promise.all([
      api(`/issues?labels=jarvis-trigger&state=open&per_page=20`),
      api(`/issues?labels=jarvis-trigger&state=closed&per_page=15`),
      fetch(`https://api.github.com/search/issues?q=is:pr+author:${OWNER}+head:jarvis/&sort=created&order=desc&per_page=20`).then(r => r.json())
    ]);

    // Pending
    const pendingEl = document.getElementById("pending");
    if (!openTriggers.length) {
      pendingEl.className = "empty"; pendingEl.textContent = "No pending triggers.";
    } else {
      pendingEl.className = ""; pendingEl.innerHTML = openTriggers.map(i => {
        const inProgress = i.labels.some(l => l.name === "jarvis-in-progress");
        return `<div class="item">
          <div><span class="status-dot open"></span><a href="${i.html_url}" target="_blank">${esc(i.title)}</a>
            <div class="meta">#${i.number} · opened ${timeAgo(i.created_at)}${inProgress ? " · <b>in progress</b>" : ""}</div></div>
        </div>`;
      }).join("");
    }

    // Open PRs
    const prsEl = document.getElementById("prs");
    const items = prs.items || [];
    if (!items.length) {
      prsEl.className = "empty"; prsEl.textContent = "No open PRs from Jarvis right now.";
    } else {
      prsEl.className = ""; prsEl.innerHTML = items.map(p => `<div class="item">
          <div><a href="${p.html_url}" target="_blank">${esc(p.title)}</a>
            <div class="meta">${p.repository_url.split('/').slice(-2).join('/')} · #${p.number} · ${timeAgo(p.created_at)}</div></div>
        </div>`).join("");
    }

    // History
    const histEl = document.getElementById("history");
    if (!closedTriggers.length) {
      histEl.className = "empty"; histEl.textContent = "No completed triggers yet.";
    } else {
      histEl.className = ""; histEl.innerHTML = closedTriggers.map(i => `<div class="item">
          <div><span class="status-dot done"></span><a href="${i.html_url}" target="_blank">${esc(i.title)}</a>
            <div class="meta">#${i.number} · closed ${timeAgo(i.closed_at)}</div></div>
        </div>`).join("");
    }

    document.getElementById("lastUpdated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById("error").textContent = `Failed to load: ${e.message} (GitHub API rate limits unauthenticated requests to 60/hr per IP)`;
  }
}
load();
</script>
</body>
</html>
